<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aquaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f2fe" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#0891b2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(6, 6) scale(0.48)">
    <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="#060e1e" stroke="url(#aquaGradient)" stroke-width="4" filter="url(#glow)"/>
    <polygon points="50,14 80,32 80,68 50,86 20,68 20,32" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="2"/>
    <path d="M32 68 V32 L68 68 V32" stroke="url(#aquaGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="4" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="64" y="34" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="1.5">NOVEX<tspan fill="url(#aquaGradient)">HOST</tspan></text>
  <text x="66" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#38bdf8" letter-spacing="3" opacity="0.9">PREMIUM CLOUD &amp; VPS</text>
</svg>
